version: 2

models:
  - name: stg_telemetry
    description: "Camada Staging com padronizacao 1:1 da telemetria bruta de rede e flag booleana de violacao de SLA."
    columns:
      - name: router_id
        description: "Identificador univoco do no de rede/roteador corporativo."
        tests:
          - not_null
      - name: is_sla_breached
        description: "Flag binaria indicando se os parametros de latencia e perda violaram o contrato de SLA."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['true', 'false']

  - name: agg_router_health
    description: "Data Mart executivo consolidado com volume total de eventos e taxa percentual de saude operacional por no de rede."
    columns:
      - name: router_id
        description: "Chave primaria do Data Mart agregada por no de rede."
        tests:
          - unique
          - not_null
      - name: total_events
        description: "Volume total de eventos de telemetria processados para o roteador."
        tests:
          - not_null
      - name: sla_breach_rate_pct
        description: "Taxa percentual de violacoes de SLA calculada sobre o total de telemetrias."
        tests:
          - not_null
